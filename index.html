                    <th contenteditable="true" class="px-4 py-2">Phone</th>
                    <th contenteditable="true" class="px-4 py-2">Email</th>
                    <th contenteditable="true" class="px-4 py-2">Last Called BY</th>
                    <th contenteditable="true" class="px-4 py-2">Initial Notes</th>
                    <th contenteditable="true" class="px-4 py-2">25th Aug</th>
                    <th contenteditable="true" class="px-4 py-2">26th Aug</th>
                    <th contenteditable="true" class="px-4 py-2">Status</th>

                <input type="text" placeholder="Concerned Person / Contact" id="contact" class="border p-2 rounded w-full">
                <input type="text" placeholder="Designation" id="designation" class="border p-2 rounded w-full">
                <input type="text" placeholder="Phone" id="phone" class="border p-2 rounded w-full">
                <input type="email" placeholder="Email" id="email" class="border p-2 rounded w-full">
                <input type="text" placeholder="Last Called BY" id="lastCalledBy" class="border p-2 rounded w-full">
                <textarea placeholder="Initial Notes" id="initialNotes" class="border p-2 rounded w-full"></textarea>
                <input type="text" placeholder="25th Aug" id="aug25" class="border p-2 rounded w-full">

                <input type="number" placeholder="Rank 0-10" id="rank" min="0" max="10" class="border p-2 rounded w-full" oninput="updateStatusFromRankModal()">
                <select id="status" class="border p-2 rounded w-full">

                    <option value="Need nurturing">Need nurturing</option>
                    <option value="LOST">LOST</option>
                    <option value="OUT OF REACH">OUT OF REACH</option>
                    <option value="Consideration">Consideration</option>
                    <option value="Interest">Interest</option>
                    <option value="Awareness">Awareness</option>

                    <button type="submit" class="px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700">Save</button>
                </div>
            </form>
        </div>
    </div>

    function updateStatusByRank() {
        pipelineData.forEach(item => {
            if(item["Rank(0-10)"] !== null && item["Rank(0-10)"] !== undefined && item["Rank(0-10)"] !== '') {
                // Ensure the Rank(0-10) value is treated as a number
                const rank = Number(item["Rank(0-10)"]);
                if (rank > 7) {
                    item.Status = 'In Process';
                } else if (rank > 5) {
                    item.Status = 'Need nurturing';
                } else if (rank > 2) {
                    item.Status = 'Interest';
                } else if (rank > 0) {
                    item.Status = 'Awareness';
                } else if (rank === 0) {
                    item.Status = 'LOST';
                }
                // If status is "OUT OF REACH" it should not be overridden by rank
                if (item.Status === 'OUT OF REACH') {
                    // Do nothing, keep existing status
                }
            }
        });
    }

    function updateStatusFromRankModal() {
        const rank = Number(document.getElementById('rank').value);
        if(rank > 7) document.getElementById('status').value = 'In Process';
        else if(rank > 5) document.getElementById('status').value = 'Need nurturing';
        else if(rank > 2) document.getElementById('status').value = 'Interest';
        else if(rank > 0) document.getElementById('status').value = 'Awareness';
        else if(rank === 0) document.getElementById('status').value = 'LOST';
        // Preserve "OUT OF REACH" if it was already selected
        if (document.getElementById('status').value === 'OUT OF REACH') {
            // Keep the current value if it's OUT OF REACH, don't change it based on rank
        }
    }

    function renderTable(data) {
        updateStatusByRank(); // Update status before rendering

        const tableBody = document.querySelector('#pipelineTable tbody');
        tableBody.innerHTML = '';
        data.forEach((item, index) => {
            const row = tableBody.insertRow();
            row.className = "hover:bg-gray-100 transition-colors";
            // Define the order of keys to match table headers explicitly
            const orderedKeys = [
                "Company Name", "Website", "Concerned Person / Contact", "Designation",
                "Phone", "Email", "Last Called BY", "Initial Notes",
                "25th Aug", "26th Aug", "Status", "Rank(0-10)"
            ];

            orderedKeys.forEach(key => {
                const cell = row.insertCell();
                let value = item[key] || '-'; // Use '-' for empty values
                if(key === "Website" && value && value !== '-') {
                    cell.innerHTML = `<a href="${value}" target="_blank" class="text-blue-600 hover:underline">${value.replace(/^https?:\/\//,'')}</a>`;
                } else if(key === "Email" && value !== '-' && value !== '') {
                    cell.innerHTML = `<a href="mailto:${value}" class="text-blue-600 hover:underline">${value}</a>`;
                } else {
                    cell.textContent = value;
                }
                cell.className += " px-4 py-2 text-sm";
            });

            const actionCell = row.insertCell();
            actionCell.className = "px-4 py-2";
            actionCell.innerHTML = `
                <button onclick="editLead(${index})" class="text-white bg-blue-500 hover:bg-blue-600 px-2 py-1 rounded mr-1 text-xs">Edit</button>
                <button onclick="deleteLead(${index})" class="text-white bg-red-500 hover:bg-red-600 px-2 py-1 rounded text-xs">Delete</button>
            `;
        });
        updateSummaryCards(data);
        renderCharts();
    }

    function updateSummaryCards(data) {
        document.getElementById('totalCompanies').textContent = data.length;
        document.getElementById('inProcess').textContent = data.filter(i=>i.Status==='In Process').length;
        document.getElementById('needNurturing').textContent = data.filter(i=>i.Status==='Need nurturing').length;
        document.getElementById('lostLeads').textContent = data.filter(i=>i.Status==='LOST').length;
        // This would require a "Date Added" field to be accurate
        document.getElementById('newLeadsToday').textContent = 0;
    }

    function filterTable() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const statusFilter = document.getElementById('statusFilter').value;
        const filtered = pipelineData.filter(item => {
            const matchesSearch = Object.values(item).some(val => String(val).toLowerCase().includes(searchTerm));
            const matchesStatus = !statusFilter || item.Status===statusFilter;
            return matchesSearch && matchesStatus;
        });
        renderTable(filtered);
    }

    function openAddModal() {
        editIndex = null;

        document.getElementById('rank').value = ''; // Clear rank for new entry
        document.getElementById('leadModal').classList.remove('hidden');
        document.getElementById('leadModal').classList.add('flex');
    }

    function closeModal() {
        document.getElementById('leadModal').classList.add('hidden');
        document.getElementById('leadModal').classList.remove('flex');

        else pipelineData.push(newLead);

        renderTable(pipelineData);

    function editLead(index){

        document.getElementById('companyName').value=item["Company Name"];

        document.getElementById('contact').value=item["Concerned Person / Contact"];
        document.getElementById('designation').value=item["Designation"];
        document.getElementById('phone').value=item["Phone"];
        document.getElementById('email').value=item["Email"];
        document.getElementById('lastCalledBy').value=item["Last Called BY"];
        document.getElementById('initialNotes').value=item["Initial Notes"];
        document.getElementById('aug25').value=item["25th Aug"];
        document.getElementById('aug26').value=item["26th Aug"];
        document.getElementById('rank').value=item["Rank(0-10)"];
        document.getElementById('status').value=item.Status;
        document.getElementById('leadModal').classList.remove('hidden');
        document.getElementById('leadModal').classList.add('flex');
    }

    function deleteLead(index){
        if(confirm("Are you sure you want to delete this lead?")) {
            pipelineData.splice(index,1);
            renderTable(pipelineData);
        }
    }

    // Initial render
    document.addEventListener('DOMContentLoaded', ()=> renderTable(pipelineData));

    function sortTable(n) {
        let rows, switching, i, x, y, shouldSwitch, dir, switchcount = 0;
        const table = document.getElementById("pipelineTable");
        switching = true;
        dir = "asc"; // Set the direction to ascending first
        while (switching) {
            switching = false;
            rows = table.rows;
            /* Loop through all table rows (except the first, which contains table headers): */
            for (i = 1; i < (rows.length - 1); i++) {
                // Start by saying there should be no switching:
                shouldSwitch = false;
                /* Get the two elements you want to compare, one from current row and one from the next: */
                x = rows[i].getElementsByTagName("TD")[n];
                y = rows[i + 1].getElementsByTagName("TD")[n];

                /* Check if the two rows should switch place, based on the direction, asc or desc: */
                let xContent = x.textContent.toLowerCase();
                let yContent = y.textContent.toLowerCase();

                // Handle numerical comparison for Rank column
                if (n === 11) { // Assuming Rank is the 12th column (index 11)
                    xContent = parseFloat(x.textContent) || 0; // Convert to number, default to 0 if not a valid number
                    yContent = parseFloat(y.textContent) || 0;
                }

                if (dir == "asc") {
                    if (xContent > yContent) {
                        shouldSwitch = true;
                        break;
                    }
                } else if (dir == "desc") {
                    if (xContent < yContent) {
                        shouldSwitch = true;
                        break;
                    }
                }
            }
            if (shouldSwitch) {
                /* If a switch has been marked, make the switch and mark that a switch has been done: */
                rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                switching = true;
                // Each time a switch is done, increase this count by 1:
                switchcount++;
            } else {
                /* If no switching has been done AND the direction is "asc", set the direction to "desc" and run the while loop again. */
                if (switchcount == 0 && dir == "asc") {
                    dir = "desc";
                    switching = true;
                }
            }
        }
    }
