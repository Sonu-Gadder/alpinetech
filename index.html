<body class="bg-gray-100 p-6">

            <option value="Need nurturing">Need nurturing</option>

    <!-- Table -->

                    <th class="px-4 py-2">Website</th>
                    <th class="px-4 py-2">Contact</th>
                    <th class="px-4 py-2">Designation</th>
                    <th class="px-4 py-2">Phone</th>
                    <th class="px-4 py-2">Email</th>
                    <th class="px-4 py-2">Last Called BY</th>
                    <th class="px-4 py-2">Initial Notes</th>
                    <th class="px-4 py-2">25th Aug</th>
                    <th class="px-4 py-2">26th Aug</th>
                    <th class="px-4 py-2">Status</th>
                    <th class="px-4 py-2 cursor-pointer" onclick="sortTable(11)">Rank (0-10)</th>
                    <th class="px-4 py-2">Actions</th>

            </thead>
            <tbody class="divide-y divide-gray-200"></tbody>
        </table>
    </div>

    <!-- Add/Edit Modal -->

            <h2 class="text-xl font-bold mb-4" id="modalTitle">Add New Lead</h2>
            <form id="leadForm" class="space-y-2">
                <input type="text" placeholder="Company Name" id="companyName" class="border p-2 rounded w-full" required>
                <input type="text" placeholder="Website" id="website" class="border p-2 rounded w-full">
                <input type="text" placeholder="Contact" id="contact" class="border p-2 rounded w-full">
                <input type="text" placeholder="Designation" id="designation" class="border p-2 rounded w-full">
                <input type="text" placeholder="Phone" id="phone" class="border p-2 rounded w-full">
                <input type="email" placeholder="Email" id="email" class="border p-2 rounded w-full">
                <input type="text" placeholder="Last Called BY" id="lastCalledBy" class="border p-2 rounded w-full">
                <textarea placeholder="Initial Notes" id="initialNotes" class="border p-2 rounded w-full"></textarea>
                <input type="text" placeholder="25th Aug" id="aug25" class="border p-2 rounded w-full">
                <input type="text" placeholder="26th Aug" id="aug26" class="border p-2 rounded w-full">
                <select id="status" class="border p-2 rounded w-full">
                    <option value="In Process">In Process</option>
                    <option value="Need nurturing">Need nurturing</option>
                    <option value="LOST">LOST</option>
                    <option value="OUT OF REACH">OUT OF REACH</option>

                <input type="number" placeholder="Rank 0-10" id="rank" min="0" max="10" class="border p-2 rounded w-full">
                <div class="flex justify-end space-x-2 mt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded bg-gray-300 hover:bg-gray-400">Cancel</button>
                    <button type="submit" class="px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700">Save</button>
                </div>
            </form>
        </div>
    </div>

let editIndex = null;

// Render Table
function renderTable(data) {
    const tableBody = document.querySelector('#pipelineTable tbody');
    tableBody.innerHTML = '';
    data.forEach((item, index) => {
        const row = tableBody.insertRow();
        row.className = "hover:bg-gray-100 transition-colors";
        Object.keys(item).forEach(key => {
            const cell = row.insertCell();
            let value = item[key] || '-';
            if(key === "Website" && value) {
                cell.innerHTML = `<a href="${value}" target="_blank" class="text-blue-600 hover:underline">${value.replace(/^https?:\/\//,'')}</a>`;
            } else if(key === "Email" && value !== '-' && value !== '') {
                cell.innerHTML = `<a href="mailto:${value}" class="text-blue-600 hover:underline">${value}</a>`;
            } else if(key === "Rank(0-10)") {
                cell.textContent = value; // Numeric points
            } else {
                cell.textContent = value;
            }
            cell.className += " px-4 py-2 text-sm";
        });

        // Actions column
        const actionCell = row.insertCell();
        actionCell.className = "px-4 py-2";
        actionCell.innerHTML = `
            <button onclick="editLead(${index})" class="text-white bg-blue-500 hover:bg-blue-600 px-2 py-1 rounded mr-1 text-xs">Edit</button>
            <button onclick="deleteLead(${index})" class="text-white bg-red-500 hover:bg-red-600 px-2 py-1 rounded text-xs">Delete</button>
        `;
    });
    updateSummaryCards(data);
    renderCharts();
}

// Summary Cards
function updateSummaryCards(data) {
    document.getElementById('totalCompanies').textContent = data.length;
    document.getElementById('inProcess').textContent = data.filter(i=>i.Status==='In Process').length;
    document.getElementById('needNurturing').textContent = data.filter(i=>i.Status==='Need nurturing').length;
    document.getElementById('lostLeads').textContent = data.filter(i=>i.Status==='LOST').length;
    document.getElementById('newLeadsToday').textContent = 0;
}

// Filter Table
function filterTable() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const statusFilter = document.getElementById('statusFilter').value;
    const filtered = pipelineData.filter(item => {
        const matchesSearch = Object.values(item).some(val => String(val).toLowerCase().includes(searchTerm));
        const matchesStatus = !statusFilter || item.Status===statusFilter;
        return matchesSearch && matchesStatus;
    });
    renderTable(filtered);
}

// Open Add Modal
function openAddModal() {
    editIndex = null;
    document.getElementById('leadForm').reset();
    document.getElementById('modalTitle').textContent = "Add New Lead";
    document.getElementById('leadModal').classList.remove('hidden');
    document.getElementById('leadModal').classList.add('flex');
}

// Close Modal
function closeModal() {
    document.getElementById('leadModal').classList.add('hidden');
    document.getElementById('leadModal').classList.remove('flex');
}

// Add/Edit Lead
document.getElementById('leadForm').addEventListener('submit', function(e){
    e.preventDefault();
    const newLead = {
        "Company Name": document.getElementById('companyName').value,
        "Website": document.getElementById('website').value,
        "Concerned Person / Contact": document.getElementById('contact').value,
        "Designation": document.getElementById('designation').value,
        "Phone": document.getElementById('phone').value,
        "Email": document.getElementById('email').value,
        "Last Called BY": document.getElementById('lastCalledBy').value,
        "Initial Notes": document.getElementById('initialNotes').value,
        "25th Aug": document.getElementById('aug25').value,
        "26th Aug": document.getElementById('aug26').value,
        "Status": document.getElementById('status').value,
        "Rank(0-10)": Number(document.getElementById('rank').value)
    };
    if(editIndex!==null) pipelineData[editIndex]=newLead;
    else pipelineData.push(newLead);
    closeModal();
    renderTable(pipelineData);
});

// Edit Lead
function editLead(index){
    editIndex=index;
    const lead=pipelineData[index];
    document.getElementById('modalTitle').textContent="Edit Lead";
    document.getElementById('companyName').value=lead["Company Name"];
    document.getElementById('website').value=lead["Website"];
    document.getElementById('contact').value=lead["Concerned Person / Contact"];
    document.getElementById('designation').value=lead["Designation"];
    document.getElementById('phone').value=lead["Phone"];
    document.getElementById('email').value=lead["Email"];
    document.getElementById('lastCalledBy').value=lead["Last Called BY"];
    document.getElementById('initialNotes').value=lead["Initial Notes"];
    document.getElementById('aug25').value=lead["25th Aug"];
    document.getElementById('aug26').value=lead["26th Aug"];
    document.getElementById('status').value=lead["Status"];
    document.getElementById('rank').value=lead["Rank(0-10)"];
    document.getElementById('leadModal').classList.remove('hidden');
    document.getElementById('leadModal').classList.add('flex');
}

// Delete Lead
function deleteLead(index){
    if(confirm("Are you sure you want to delete this lead?")){
        pipelineData.splice(index,1);
        renderTable(pipelineData);
    }
}

// Charts
function renderCharts() {
    if(typeof Chart === 'undefined') return; // Skip if Chart.js not loaded

    // Status Chart
    const statusCounts = {};
    pipelineData.forEach(item => {
        const status = item.Status || 'No Status';
        statusCounts[status] = (statusCounts[status] || 0) + 1;
    });

    const statusCtx = document.getElementById('statusChart').getContext('2d');
    if(window.statusChart) window.statusChart.destroy();
    window.statusChart = new Chart(statusCtx, {
        type: 'doughnut',
        data: {
            labels: Object.keys(statusCounts),
            datasets: [{
                data: Object.values(statusCounts),
                backgroundColor: ['#2563EB','#F59E0B','#EF4444','#6B7280','#10B981']
            }]
        },
        options: { responsive: true, plugins:{legend:{position:'bottom'}} }
    });

    // Rank Chart
    const rankCounts = Array(11).fill(0);
    pipelineData.forEach(item => {
        const r = item["Rank(0-10)"];
        if(r!==null && r!==undefined) rankCounts[r]++;
    });

    const rankCtx = document.getElementById('rankChart').getContext('2d');
    if(window.rankChart) window.rankChart.destroy();
    window.rankChart = new Chart(rankCtx, {
        type: 'bar',
        data: {
            labels: [...Array(11).keys()],
            datasets: [{ label: 'Leads', data: rankCounts, backgroundColor: '#3B82F6' }]
        },
        options:{ responsive:true, scales:{y:{beginAtZero:true}} }
    });
}

// Initial render
document.addEventListener('DOMContentLoaded',()=>renderTable(pipelineData));
